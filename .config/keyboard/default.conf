# /etc/keyd/default.conf
#
# keyd operates on physical keys, NOT on the currently active de layout.
# Target characters are therefore NOT produced via keyd's built-in
# "character -> US key" automatism (assumes a US layout, breaks on de),
# but via explicit AltGr combos, matching what the real de(basic) xkb
# layout defines.

[ids]
*

[main]

# Capslock ALWAYS sends Escape, direct 1:1 remap, no toggle
capslock = esc

[control]

# <C-b> permanently toggles the programmer layer on/off
b = toggle(programmer)

[programmer]

# ö key -> @   (AltGr+Q)
semicolon  = G-q

# ä key -> {   (AltGr+7)
apostrophe = G-7

# ü key -> [   (AltGr+8)
leftbrace  = G-8

# ´ key -> ~   (AltGr on the +/rightbrace key)
equal      = G-rightbrace

[programmer+shift]

# Composite layer: Shift + programmer held simultaneously.
# EVERY shift combo must be listed explicitly here, otherwise the
# real Shift bleeds into the G-x macros above (Level4 = Shift+AltGr
# of the target key instead of Level3 = AltGr) -- that's exactly what
# caused the Ö->Ω and Shift+´->¯ bug.

# Shift+ä key -> }   (AltGr+0)
apostrophe = G-0

# Shift+ü key -> ]   (AltGr+9)
leftbrace  = G-9

# Shift+ö key -> Ö (stays normal, just blocks fallthrough to G-q,
# otherwise Shift+AltGr+Q = Ω comes out)
semicolon  = semicolon

# Shift+´ key -> ` (backtick). de(basic) has no live key for this --
# Shift+´ is itself just a dead key (dead_grave). Trick: trigger that
# dead key, then immediately send space, which resolves it to a plain `.
#
# BUT! if you remove `dead keys` from your virtual keyboard - this won't ever be an actual issue!
equal      = macro(S-equal)
